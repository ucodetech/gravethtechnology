deployment:
  tasks:
    # 1. Set deployment path
    - export DEPLOYPATH=/home/gravetht/public_html

    # 2. Copy files safely, excluding sensitive files
    - /bin/rsync -av --exclude='.git' --exclude='.env' * $DEPLOYPATH

    # 3. Backend setup
    - cd $DEPLOYPATH && /usr/local/bin/composer install --optimize-autoloader --no-dev
    - cd $DEPLOYPATH && php artisan migrate --force
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan storage:link

    # 4. Frontend setup
    - cd $DEPLOYPATH && /usr/local/bin/npm install
    - cd $DEPLOYPATH && npm run build

    # 5. Environment handling
    # Ensure .env file stays in place and is not overwritten
    - echo "Keeping existing .env file intact"
